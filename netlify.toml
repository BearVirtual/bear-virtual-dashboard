# netlify.toml
# Place this file in the ROOT of your bear-virtual-dashboard folder
# (same level as package.json — not inside src/)

[build]
  command   = "npm run build"   # How to build the React app
  publish   = "dist"            # Where Vite puts the built files

[functions]
  directory = "netlify/functions"   # Where your serverless functions live

# Redirect /api/claude → the serverless function
# This lets App.jsx call fetch("/api/claude") instead of the full Netlify URL
[[redirects]]
  from   = "/api/claude"
  to     = "/.netlify/functions/claude"
  status = 200

# Catch-all redirect so React Router works correctly on page refresh
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
